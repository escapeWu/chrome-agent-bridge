name: Release extension ZIP

# Cut a release in one click: Actions → "Release extension ZIP" → Run workflow
# from main with `bump` = patch | minor | major | X.Y.Z. The run bumps every
# version file, commits to main, tags, builds the ZIP, and publishes the Release.
#
# Pushing a vX.Y.Z tag by hand (versions already matching) or re-running an
# existing tag via `tag` still works.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: "New release from main: patch, minor, major, or an explicit X.Y.Z"
        required: false
      tag:
        description: "Or re-release an existing vX.Y.Z tag instead of bumping"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          if [ -n "$BUMP" ] && [ -n "$TAG" ]; then
            echo "::error::Set either bump or tag, not both"; exit 1
          fi
          if [ -z "$BUMP" ] && [ -z "$TAG" ]; then
            echo "::error::Set bump (patch|minor|major|X.Y.Z) for a new release, or tag to re-release one"; exit 1
          fi
          if [ -n "$BUMP" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run a bump release from the main branch"; exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Bump version, commit, and tag
        id: bump
        if: github.event_name == 'workflow_dispatch' && inputs.bump != ''
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          VERSION=$(node scripts/bump-version.mjs "$BUMP")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json extension/manifest.json .codex-plugin/plugin.json
          git commit -m "Release v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Resolve release tag
        id: release
        env:
          BUMPED_TAG: ${{ steps.bump.outputs.tag }}
          MANUAL_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: echo "tag=${BUMPED_TAG:-${MANUAL_TAG:-$PUSH_TAG}}" >> "$GITHUB_OUTPUT"
      - run: node scripts/check-release-version.mjs "${{ steps.release.outputs.tag }}"
      - run: npm run build:extension
      - run: cd dist && sha256sum *.zip > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.release.outputs.tag }}" dist/*.zip dist/SHA256SUMS.txt
          --generate-notes
          --notes "Install: download the attached Extension ZIP, extract it, then select the extracted directory from chrome://extensions → Developer mode → Load unpacked. Agent setup also requires the repository's MCP server and paired chrome-agent-control Skill; follow docs/agent-installation.md."
          --verify-tag
